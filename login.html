<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — AntiBotWall</title>
</head>
<body>
  <header>
    <a href="./">AntiBotWall</a>
  </header>

  <main>
    <h1>Connexion</h1>
    <p>Connectez-vous à votre compte.</p>

    <form>
      <div>
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >
      </div>

      <div>
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit">Se connecter</button>
    </form>

    <p><a href="./">Retour à l’accueil</a></p>
  </main>
</body>
</html>
