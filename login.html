<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
</head>
<body>
  <section style="font:14px system-ui;background:#ffffff;color:#17251d;padding:20px;border:1px solid #dfe5df;border-radius:12px"><h2>Se connecter</h2><p>Choisissez votre méthode de connexion.</p>
  <div style="margin:18px 0 22px"><iframe src="https://antibotwall.reqeuss.com/embed/captcha.html?site=abw_pub_de1c5964a6d842e6cfe98d15214001b61bb25558f89de9b1" title="AntiBotWall CAPTCHA" style="width:100%;max-width:380px;height:190px;border:0" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms"></iframe><p id="captcha-status" role="status" style="font-size:13px;color:#647067">Veuillez compléter le CAPTCHA si demandé.</p></div><p><a style="display:block;padding:11px;border:1px solid #dfe5df;border-radius:8px;text-decoration:none;color:inherit" href="https://antibotwall.reqeuss.com/oauth/discord/start?site=abw_pub_de1c5964a6d842e6cfe98d15214001b61bb25558f89de9b1">Continuer avec Discord</a></p><p><a style="display:block;padding:11px;border:1px solid #dfe5df;border-radius:8px;text-decoration:none;color:inherit" href="https://antibotwall.reqeuss.com/oauth/github/start?site=abw_pub_de1c5964a6d842e6cfe98d15214001b61bb25558f89de9b1">Continuer avec GitHub</a></p><p><a style="display:block;padding:11px;border:1px solid #dfe5df;border-radius:8px;text-decoration:none;color:inherit" href="https://antibotwall.reqeuss.com/oauth/google/start?site=abw_pub_de1c5964a6d842e6cfe98d15214001b61bb25558f89de9b1">Continuer avec Google</a></p><p><a style="display:block;padding:11px;border:1px solid #dfe5df;border-radius:8px;text-decoration:none;color:inherit" href="https://antibotwall.reqeuss.com/oauth/epsilonsocial/start?site=abw_pub_de1c5964a6d842e6cfe98d15214001b61bb25558f89de9b1">Continuer avec Epsilon Social</a></p></section>
  <script>
    window.addEventListener("message", e => {
      if (e.origin !== "https://antibotwall.reqeuss.com" || e.data?.type !== "antibotwall:verified") return;
      console.log("CAPTCHA verified", e.data.token, e.data.siteKey);
      const status = document.getElementById("captcha-status");
      if (status) { status.textContent = "CAPTCHA vérifié."; status.style.color = "#16803c"; }
    });
  </script>
</body>
</html>
